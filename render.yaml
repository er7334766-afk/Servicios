services:
  - type: web
    name: servihn-soporte
    env: node
    plan: free
    root: "backend"
    # Ensure devDependencies (tsc) are installed during build and run the TypeScript build
    buildCommand: "cd backend && npm install --include=dev && npm run build"
    startCommand: "cd backend && npm start"
    autoDeploy: true
